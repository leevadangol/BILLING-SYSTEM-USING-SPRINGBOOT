<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Billing System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<div class="login-card">
    <h2>Login</h2>
    <div class="alert error" th:if="${param.error}">Incorrect username or password.</div>
    <div class="alert success" th:if="${param.logout}">You have been logged out.</div>
    <form th:action="@{/login}" method="post" autocomplete="off">
        <input type="text" name="username" placeholder="Enter Username" required autofocus>
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit" class="btn btn-blue login-btn">Login</button>
    </form>
</div>
</body>
</html>
