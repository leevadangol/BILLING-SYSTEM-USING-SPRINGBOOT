<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${title})}"></head>
<body>
<header th:replace="~{fragments :: topbar}"></header>
<main class="container">
    <h2 th:text="${title}">Product Report</h2>
    <th:block th:replace="~{fragments :: messages}"></th:block>

    <table>
        <tr><th>Product Name</th><th>Description</th><th>Quantity</th><th>Price</th></tr>
        <tr th:each="p : ${products}">
            <td th:text="${p.productName}">Name</td>
            <td th:text="${p.description}">Description</td>
            <td th:text="${p.quantity}">1</td>
            <td th:text="${#numbers.formatDecimal(p.price, 1, 2)}">1.00</td>
        </tr>
        <tr th:if="${products.isEmpty()}"><td colspan="4" class="center">No products found.</td></tr>
    </table>
    <p><strong>Total products: <span th:text="${total}">0</span></strong></p>
    <div class="actions">
        <a class="btn btn-green" th:href="@{/report}">Refresh</a>
        <a class="btn btn-blue" th:href="@{/home}">Back</a>
    </div>
</main>
</body>
</html>
