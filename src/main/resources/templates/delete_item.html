<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${title})}"></head>
<body>
<header th:replace="~{fragments :: topbar}"></header>
<main class="container">
    <h2 th:text="${title}">Delete Item</h2>
    <th:block th:replace="~{fragments :: messages}"></th:block>

    <table>
        <tr><th>ID</th><th>Product Name</th><th>Description</th><th>Quantity</th><th>Price</th><th>Action</th></tr>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.productName}">Name</td>
            <td th:text="${p.description}">Description</td>
            <td th:text="${p.quantity}">1</td>
            <td th:text="${#numbers.formatDecimal(p.price, 1, 2)}">1.00</td>
            <td>
                <form th:action="@{/items/delete}" method="post"
                      onsubmit="return confirm('Are you sure you want to delete this product?');">
                    <input type="hidden" name="id" th:value="${p.id}">
                    <button type="submit" class="btn btn-red small">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${products.isEmpty()}"><td colspan="6" class="center">No products found.</td></tr>
    </table>
    <div class="actions"><a class="btn btn-blue" th:href="@{/home}">Back</a></div>
</main>
</body>
</html>
